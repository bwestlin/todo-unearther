[package]
name = "todo-unearther"
version = "0.1.1"
edition = "2024"
description = "Fast TODO discovery, flexible reports, and optional GitHub and Git enrichment"
license = "MIT"
repository = "https://github.com/bwestlin/todo-unearther"
homepage = "https://github.com/bwestlin/todo-unearther"
readme = "README.md"
keywords = ["todo", "github", "cli", "report", "git"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
globset = "0.4"
ignore = "0.4"
open = "5.4"
rayon = "1.11"
regex = "1.12"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tiny_http = "0.12"

[[bench]]
name = "reports"
harness = false

[profile.release]
lto = "thin"
strip = true

