name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p archive
          asset="todo-unearther-${TARGET}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/${TARGET}/release/todo-unearther.exe" archive/
            cp LICENSE README.md archive/
            7z a "${asset}.zip" ./archive/*
          else
            cp "target/${TARGET}/release/todo-unearther" archive/
            cp LICENSE README.md archive/
            tar -czf "${asset}.tar.gz" -C archive .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            todo-unearther-*.tar.gz
            todo-unearther-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Create release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum todo-unearther-*.tar.gz todo-unearther-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" todo-unearther-*.tar.gz todo-unearther-*.zip SHA256SUMS --generate-notes --verify-tag
